<main class="auth">
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h1>Sign in</h1>
    <p class="sub">Sign in to run scans and review findings.</p>
    <form id="login-form" action="overview.html" method="get">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="foot">
      <div>No account? <a href="#">Register</a></div>
      <div><a href="index.html">Back home</a></div>
    </div>
  </div>
</main>

<footer class="footer">

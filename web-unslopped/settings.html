<main class="wrap">
  <div class="page-head">
    <h1>Settings</h1>
  </div>
  <div class="section">
    <div class="card">
      <div class="card-head"><h2>AI enhancement keys</h2></div>
      <div class="field"><p class="form-note">Read from <span class="keycap">OPENAI_API_KEY</span> / <span class="keycap">ANTHROPIC_API_KEY</span> on the server.</p></div>
      <div class="field">
        <label for="openai-key">OpenAI key</label>
        <input class="input mono" id="openai-key" type="text" placeholder="sk-…">
      </div>
      <div class="field">
        <label for="anthropic-key">Anthropic key</label>
        <input class="input mono" id="anthropic-key" type="text" placeholder="sk-ant-…">
      </div>
    </div>
  </div>
  <div class="section">
    <form id="settings-form" class="card">
      <div class="card-head"><h2>Scan defaults</h2></div>
      <div class="form-grid">
        <div class="field">
          <label for="default-concurrency">Concurrency</label>
          <input class="input" id="default-concurrency" type="number" value="30">
        </div>
        <div class="field">
          <label for="default-rate">Rate /s</label>
          <input class="input" id="default-rate" type="number" value="10">
        </div>
        <div class="field">
          <label for="default-depth">Depth</label>
          <input class="input" id="default-depth" type="number" value="2">
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Save settings</button>
    </form>
  </div>
</main>
<footer class="footer">
  <div class="wrap">
    <span>SentinelX — a real, working vulnerability scanner.</span>
    <span>Only scan targets you own or are authorised to test.</span>
  </div>
</footer>
<script src="assets/app.js"></script>
</body>
